# Hetzner Root Domain .htaccess (/usr/www/users/almonc/.htaccess)
# Handles root rewrites and redirects to the revamped Laravel portal (/home/)

DirectoryIndex index.php
RewriteEngine on
php_value default_charset None

# Revamped Short URLs -> Laravel Portal (/home/)
RewriteRule ^l/([0-9]+)$ https://www.almoneer.org/home/l/$1 [R=301,L,NC]
RewriteRule ^b/([0-9]+)$ https://www.almoneer.org/home/b/$1 [R=301,L,NC]
RewriteRule ^p/([0-9]+)$ https://www.almoneer.org/home/p/$1 [R=301,L,NC]
RewriteRule ^q/([0-9]+)$ https://www.almoneer.org/home/q/$1 [R=301,L,NC]
RewriteRule ^n/([0-9]+)$ https://www.almoneer.org/home/n/$1 [R=301,L,NC]

# Legacy short URLs
RewriteRule ^([0-9]+)$ http://www.almoneer.org/?act=artc&id=$1 [R,NC]
RewriteRule ^c([0-9]+)$ http://www.almoneer.org/?act=qa&action=view&id=$1 [R,NC]
