<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="arabianGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#e6b94d" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b38020" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#arabianGold)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2">
    <!-- Authentic Arabian Interlocking 8-Point Star & Girih Strapwork -->
    <!-- Central Octagram (8-pointed star) -->
    <polygon points="40,16 46,28 58,22 52,34 64,40 52,46 58,58 46,52 40,64 34,52 22,58 28,46 16,40 28,34 22,22 34,28" stroke-width="1.3" fill="rgba(230,185,77,0.03)" />
    
    <!-- Concentric Inner Star & Central Rosette Node -->
    <circle cx="40" cy="40" r="9" stroke-width="1" />
    <polygon points="40,34 42,38 46,40 42,42 40,46 38,42 34,40 38,38" fill="rgba(255,244,194,0.15)" stroke="none" />
    
    <!-- Outer Interlocking Hexagonal & Diamond Strapwork -->
    <!-- Diagonal Connecting Bands -->
    <line x1="0" y1="0" x2="80" y2="80" stroke-width="0.9" />
    <line x1="80" y1="0" x2="0" y2="80" stroke-width="0.9" />
    <line x1="40" y1="0" x2="40" y2="80" stroke-width="0.9" />
    <line x1="0" y1="40" x2="80" y2="40" stroke-width="0.9" />
    
    <!-- Outer Diamond Frame -->
    <polygon points="40,0 80,40 40,80 0,40" stroke-width="1.1" />
    
    <!-- Corner Interlocking Quarter-Stars (Seamless Tiling at all 4 corners) -->
    <!-- Top-Left (0,0) -->
    <polygon points="0,24 8,14 14,8 24,0" stroke-width="1.2" />
    <circle cx="0" cy="0" r="9" stroke-width="1" />
    
    <!-- Top-Right (80,0) -->
    <polygon points="80,24 72,14 66,8 56,0" stroke-width="1.2" />
    <circle cx="80" cy="0" r="9" stroke-width="1" />
    
    <!-- Bottom-Left (0,80) -->
    <polygon points="0,56 8,66 14,72 24,80" stroke-width="1.2" />
    <circle cx="0" cy="80" r="9" stroke-width="1" />
    
    <!-- Bottom-Right (80,80) -->
    <polygon points="80,56 72,66 66,72 56,80" stroke-width="1.2" />
    <circle cx="80" cy="80" r="9" stroke-width="1" />
  </g>
</svg>
