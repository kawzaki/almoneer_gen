<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#e5b84c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b07d1c" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#luxuryGold)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1">
