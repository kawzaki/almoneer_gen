    <circle cx="0" cy="0" r="4" stroke-width="0.9" />
    <circle cx="64" cy="0" r="4" stroke-width="0.9" />
    <circle cx="0" cy="64" r="4" stroke-width="0.9" />
    <circle cx="64" cy="64" r="4" stroke-width="0.9" />
    
    <circle cx="32" cy="0" r="2.5" stroke-width="0.8" />
    <circle cx="32" cy="64" r="2.5" stroke-width="0.8" />
    <circle cx="0" cy="32" r="2.5" stroke-width="0.8" />
    <circle cx="64" cy="32" r="2.5" stroke-width="0.8" />
  </g>
</svg>
