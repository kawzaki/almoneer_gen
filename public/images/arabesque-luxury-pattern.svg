    <!-- Interlocking Organic Arches forming Sanctuary Windows -->
    <path d="M32 0 C22 14 0 20 0 32 C0 44 22 50 32 64 C42 50 64 44 64 32 C64 20 42 14 32 0 Z" fill="rgba(229,184,76,0.015)" />
    
    <!-- Secondary Intersecting Arches -->
    <path d="M0 0 C14 10 20 22 32 32 C44 22 50 10 64 0" />
    <path d="M0 64 C14 54 20 42 32 32 C44 42 50 54 64 64" />
    <path d="M0 32 C10 20 22 14 32 0 C42 14 54 20 64 32" />
    <path d="M0 32 C10 44 22 50 32 64 C42 50 54 44 64 32" />

