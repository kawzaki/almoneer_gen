    <circle cx="32" cy="32" r="6" stroke-width="1" />
    <circle cx="32" cy="32" r="2" fill="#fff8db" fill-opacity="0.25" stroke="none" />
    
    <!-- Petal accents at 45 degrees -->
    <path d="M32 24 C34 27 36 29 39 29 C36 31 34 33 32 36 C30 33 28 31 25 29 C28 29 30 27 32 24 Z" fill="rgba(255,248,219,0.03)" stroke-width="0.8" />
    
