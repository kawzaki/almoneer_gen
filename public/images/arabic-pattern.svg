<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d4aa48" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a37418" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Star Octagram (Square + Diamond) -->
    <rect x="20" y="20" width="40" height="40" stroke-width="1.8" />
    <rect x="20" y="20" width="40" height="40" transform="rotate(45 40 40)" stroke-width="1.8" />
    
    <!-- Central Islamic Rosette & 8-petal inner flower -->
    <circle cx="40" cy="40" r="10" stroke-width="1.4" />
    <circle cx="40" cy="40" r="4" fill="#fde68a" fill-opacity="0.8" stroke="none" />
    
    <!-- Interlacing Star Straps Connecting Tiles -->
    <path d="M40 0 L60 20 M40 0 L20 20 M80 40 L60 20 M80 40 L60 60 M40 80 L60 60 M40 80 L20 60 M0 40 L20 60 M0 40 L20 20" stroke-width="1.6" />
    
    <!-- Corner Secondary Stars -->
    <rect x="-12" y="-12" width="24" height="24" transform="rotate(45 0 0)" stroke-width="1.4" />
    <rect x="68" y="-12" width="24" height="24" transform="rotate(45 80 0)" stroke-width="1.4" />
    <rect x="-12" y="68" width="24" height="24" transform="rotate(45 0 80)" stroke-width="1.4" />
    <rect x="68" y="68" width="24" height="24" transform="rotate(45 80 80)" stroke-width="1.4" />
    
    <circle cx="0" cy="0" r="5" stroke-width="1.2" />
    <circle cx="80" cy="0" r="5" stroke-width="1.2" />
    <circle cx="0" cy="80" r="5" stroke-width="1.2" />
    <circle cx="80" cy="80" r="5" stroke-width="1.2" />
  </g>
</svg>
