<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041814"/>
      <stop offset="50%" stop-color="#0a2b24"/>
      <stop offset="100%" stop-color="#02100d"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c9"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8010"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Islamic Star Pattern -->
    <pattern id="islamicPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 0 L50 25 L75 15 L65 40 L90 50 L65 60 L75 85 L50 75 L40 100 L30 75 L5 85 L15 60 L-10 50 L15 40 L5 15 L30 25 Z" 
            fill="none" stroke="#d4af37" stroke-width="0.75" opacity="0.07"/>
      <circle cx="40" cy="40" r="16" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Pattern Overlay -->
  <rect width="1280" height="720" fill="url(#islamicPattern)"/>

  <!-- Subtle Radial Glow in Center -->
  <circle cx="640" cy="340" r="380" fill="#0f4538" opacity="0.4" filter="url(#glow)"/>

  <!-- Outer Decorative Border -->
  <rect x="30" y="30" width="1220" height="660" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
  <rect x="42" y="42" width="1196" height="636" rx="18" fill="none" stroke="#d4af37" stroke-width="0.7" stroke-dasharray="8 6" opacity="0.25"/>

  <!-- Corner Accents -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.7">
    <!-- Top-Left -->
    <path d="M30 70 L70 30 M30 30 L50 30 M30 30 L30 50"/>
    <!-- Top-Right -->
    <path d="M1250 70 L1210 30 M1250 30 L1230 30 M1250 30 L1250 50"/>
    <!-- Bottom-Left -->
    <path d="M30 650 L70 690 M30 690 L50 690 M30 690 L30 670"/>
    <!-- Bottom-Right -->
    <path d="M1250 650 L1210 690 M1250 690 L1230 690 M1250 690 L1250 670"/>
  </g>

  <!-- Central Emblem Container -->
  <g transform="translate(640, 240)">
    <!-- Outer Rings -->
    <circle r="92" fill="#041b16" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9"/>
    <circle r="104" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>
    
    <!-- Video Camera Icon with Clock Indicator -->
    <g transform="translate(-40, -42) scale(1.6)" fill="url(#goldGrad)">
      <!-- Camera Body -->
      <rect x="4" y="10" width="30" height="22" rx="4" fill="url(#goldGrad)" opacity="0.9"/>
      <!-- Lens triangle -->
      <polygon points="34,16 46,9 46,33 34,26" fill="url(#goldGrad)" opacity="0.85"/>
      <!-- Reel Circle -->
      <circle cx="13" cy="21" r="5" fill="#041b16"/>
      <circle cx="13" cy="21" r="2" fill="url(#goldGrad)"/>
      <circle cx="24" cy="21" r="4" fill="#041b16"/>
      <!-- Play indicator symbol inside lens -->
      <polygon points="12,19 16,21 12,23" fill="url(#goldGrad)"/>
    </g>

    <!-- Small Badge "قريباً" -->
    <rect x="-46" y="58" width="92" height="26" rx="13" fill="#d4af37"/>
    <text x="0" y="75" text-anchor="middle" font-family="'Cairo', 'Amiri', 'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#041814">قريباً بالفيديو</text>
  </g>

  <!-- Status Text Details -->
  <!-- Main Title -->
  <text x="640" y="415" text-anchor="middle" font-family="'Amiri', 'Cairo', 'Segoe UI', serif" font-size="34" font-weight="bold" fill="#fdf4c9">
    التسجيل المرئي قيد المونتاج والإدراج
  </text>

  <!-- Subtitle / Explanation -->
  <text x="640" y="465" text-anchor="middle" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="18" fill="#94a3b8">
    يجري تجهيز الفيديو عالي الدقة وسينشر فور اكتماله بإذن الله تعالى
  </text>

  <!-- Audio and Transcript Availability Pills -->
  <g transform="translate(640, 520)">
    <!-- Audio Pill -->
    <g transform="translate(-165, 0)">
      <rect x="-140" y="-18" width="280" height="38" rx="19" fill="#132e27" stroke="#d4af37" stroke-width="1" opacity="0.9"/>
      <circle cx="-105" cy="1" r="10" fill="#d4af37" opacity="0.2"/>
      <text x="15" y="6" text-anchor="middle" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">
        🎙️ التسجيل الصوتي متوفر الآن
      </text>
    </g>

    <!-- Transcript Pill -->
    <g transform="translate(165, 0)">
      <rect x="-140" y="-18" width="280" height="38" rx="19" fill="#132e27" stroke="#d4af37" stroke-width="1" opacity="0.9"/>
      <circle cx="-105" cy="1" r="10" fill="#d4af37" opacity="0.2"/>
      <text x="15" y="6" text-anchor="middle" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">
        📄 التفريغ المكتوب متوفر أدناه
      </text>
    </g>
  </g>

  <!-- Footer Watermark -->
  <text x="640" y="640" text-anchor="middle" font-family="'Amiri', 'Cairo', serif" font-size="15" fill="#d4af37" opacity="0.6">
    شبكة سماحة السيد منير الخباز — مركز النتاج الفقهي والفكري
  </text>
</svg>
